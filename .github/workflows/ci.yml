name: Python checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install tested development dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-build-isolation -e .
      - run: python -m pytest
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python 01_functions/examples.py
      - run: python 02_data_structures/examples.py
      - run: python examples/collections_demo.py
      - run: python 03_strings_and_files/examples.py
      - run: python 04_oop/examples.py
